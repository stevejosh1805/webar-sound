<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Engine Note</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gate">
    <h1 id="gate-title">Loading…</h1>
    <p id="gate-engine"></p>
    <button id="start">▶ Hear it</button>
  </div>

  <div id="stage" hidden>
    <model-viewer id="mv"
      camera-controls auto-rotate
      ar ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1">
      <button slot="ar-button" class="ar-btn">View in your space</button>
    </model-viewer>
    <div id="info"></div>
    <button id="replay">🔊 Replay engine note</button>
  </div>

  <audio id="snd" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
